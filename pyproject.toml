[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personalized-learning-assistant"
version = "1.0.0"
description = "Dynamic educational assistant that parses textbook chapters to generate flashcards and interactive quizzes."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
